[workspace]
resolver = "3"
members = ["crates/common", "crates/server", "crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
cubeterra-common = { path = "crates/common" }
cubeterra-server = { path = "crates/server" }
serde = { version = "1", features = ["derive"] }
bincode = { version = "1.3" }
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }

# Game code is math-heavy: keep dev builds playable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = false
